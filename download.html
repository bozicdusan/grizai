<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2">
  <title>Preuzmi GrizAI</title>
  <meta name="description" content="Preuzmi GrizAI za iPhone ili Android.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}body{display:grid;min-height:100svh;margin:0;padding:24px;place-items:center;background:radial-gradient(circle at 50% 10%,#e8f8d2,#f7f8f2 52%);color:#161914;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,430px);text-align:center}.logo{width:86px;height:86px;margin:0 auto 24px;border-radius:25px;box-shadow:0 14px 34px rgba(35,48,24,.12)}h1{margin:0 0 10px;font-size:clamp(32px,9vw,46px);letter-spacing:-.05em}p{margin:0 0 28px;color:#60665c;line-height:1.6}.buttons{display:grid;gap:11px}a{display:flex;min-height:58px;align-items:center;justify-content:center;border-radius:17px;background:#161914;color:#fff;font-size:15px;font-weight:750;text-decoration:none}a:last-child{border:1px solid rgba(22,25,20,.15);background:#fff;color:#161914}.status{min-height:22px;margin-top:20px;font-size:12px}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/logo.png" alt="GrizAI">
    <h1>Preuzmi GrizAI</h1>
    <p id="message">Izaberi prodavnicu za svoj uređaj.</p>
    <div class="buttons">
      <a href="https://apps.apple.com/rs/app/grizai/id6745571241">Preuzmi za iPhone</a>
      <a href="https://play.google.com/store/apps/details?id=com.grizai.app">Preuzmi za Android</a>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </main>
  <script>
    const agent=navigator.userAgent||navigator.vendor||window.opera;let destination='';
    if(/android/i.test(agent)){destination='https://play.google.com/store/apps/details?id=com.grizai.app';}else if(/iPad|iPhone|iPod/.test(agent)&&!window.MSStream){destination='https://apps.apple.com/rs/app/grizai/id6745571241';}
    if(destination){document.getElementById('message').textContent='Otvaramo odgovarajuću prodavnicu za tvoj uređaj.';document.getElementById('status').textContent='Preusmeravanje…';window.setTimeout(()=>window.location.replace(destination),350);}
  </script>
</body>
</html>
